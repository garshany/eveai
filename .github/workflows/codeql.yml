name: codeql

# Static security analysis (GitHub code scanning). Free for public
# repositories; results appear under Security → Code scanning and as a check
# on pull requests.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, to pick up new CodeQL queries even when the code does not change.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - tests
              - node_modules
              - dist

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

      # TEMPORARY DIAGNOSTIC — print each SARIF result's rule/severity/location
      # to the job log so the alert can be localized without the Security tab.
      # Revert once the alert is identified.
      - name: Dump SARIF alerts
        if: always()
        run: |
          for f in "$GITHUB_WORKSPACE"/../results/*.sarif; do
            echo "=== $f ==="
            jq -r '.runs[].results[] | "SEV=\(.properties?."security-severity" // .rule.properties?."security-severity" // "?") LEVEL=\(.level // "?") RULE=\(.ruleId) FILE=\(.locations[0].physicalLocation.artifactLocation.uri) LINE=\(.locations[0].physicalLocation.region.startLine) MSG=\(.message.text)"' "$f" 2>/dev/null || echo "jq failed for $f"
          done
