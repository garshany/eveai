name: codeql

# Static security analysis (GitHub code scanning). Free for public
# repositories; results appear under Security → Code scanning and as a check
# on pull requests.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, to pick up new CodeQL queries even when the code does not change.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - tests
              - node_modules
              - dist

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

      # TEMPORARY DIAGNOSTIC — print every SARIF result (rule + file:line), and
      # separately the rule severities from tool.extensions, so the alert can be
      # localized. Reverted once identified.
      - name: Dump SARIF alerts
        if: always()
        run: |
          for f in "$GITHUB_WORKSPACE"/../results/*.sarif; do
            echo "=== results in $f ==="
            jq -r '.runs[].results[] | "RESULT rule=\(.ruleId) file=\(.locations[0].physicalLocation.artifactLocation.uri) line=\(.locations[0].physicalLocation.region.startLine)"' "$f" 2>/dev/null || echo "jq results failed"
            echo "=== rule severities in $f ==="
            jq -r '[.runs[].tool.driver.rules[]?, .runs[].tool.extensions[]?.rules[]?] | .[] | select(.properties?."security-severity") | "SEV \(.properties."security-severity") \(.id)"' "$f" 2>/dev/null | sort -u || echo "jq sev failed"
          done
